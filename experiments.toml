name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.rotation.steps]]
name = "rotation-seed-ci"
experiment = "rotation-seed-ci"
seed = 42 # query seed, held fixed; the rotation draws are 42, 7, 13, 29, 101
datasets = [
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
  "data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs",
]
argv = ["python3", "scripts/rotation_seed_ci.py"]

# The rotation study at the operating point the reported cells actually use. Table 3
# moved to M=16 while the draw study behind its narrow cells stayed at M=12 (`rotation`)
# and M=14 (`lowrate-rotation*`), so a table reported at one memory was being scoped by
# a sweep run at another -- and Section 5.3 itself shows the draw sensitivity changes
# with M. The three earlier bundles are retained and no longer cited.
#
# Two evidence steps rather than one: GIST is roughly two days of encoding and DBpedia
# most of another, and a crash in the second corpus should not discard the first. Both
# steps declare the same memory, so splitting them mixes no protocol.
[tiers.rotation16]
description = "Rotation-draw variability for the narrow-margin GIST and DBpedia cells at M=16"
required_files = [
  "Cargo.lock",
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
  "data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs",
]

[tiers.rotation16.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.rotation16.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.rotation16.steps]]
name = "rotation16-gist"
experiment = "rotation16-gist"
seed = 42 # query seed, held fixed; the rotation draws are 42, 7, 13, 29, 101
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["python3", "scripts/rotation_seed_ci.py", "--corpora", "GIST"]

[[tiers.rotation16.steps]]
name = "rotation16-dbpedia"
experiment = "rotation16-dbpedia"
seed = 42 # query seed, held fixed; the rotation draws are 42, 7, 13, 29, 101
datasets = ["data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs"]
argv = ["python3", "scripts/rotation_seed_ci.py", "--corpora", "DBpedia"]

# Fifteen draws on the cells the five-draw study cannot settle. The rule is stated so
# the restriction is not a choice made after seeing which cells we would like to win:
# a cell qualifies when its five-draw t-interval SPANS ZERO, so the study has not
# decided it either way. At M=16 that is GIST at one and two bits (intervals
# [-0.36,+1.68] and [-0.62,+1.22]); the three-bit cell leads every draw and the
# four-bit interval already excludes zero, so neither needs more draws.
#
# The extra draws extend the published five deterministically rather than replacing
# them, so the reported draws stay a subset of the deeper study. t(0.975,n-1)/sqrt(n)
# falls from 1.24 to 0.55 between five draws and fifteen, so an interval this wide can
# be settled without the margin itself having to move.
# Tail-biting: the start-state byte, measured where it pays and where it does not.
# The wrap pins ceil(M/b) emissions, a fraction M/(D*b) of the payload that shrinks
# with dimension, so a SIFT-only ablation would show the lever at its worst and
# nowhere else. Every row is UltraVec against itself at the reported operating point,
# across the rotation study's own five draws because two-bit GIST is decided by the
# draw. Two bits only: that is the rate every headline byte comparison is made at.
[tiers.tailbite]
description = "Tail-biting against free start on all three corpora, five rotation draws, M=16"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs",
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
  "data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs",
]

[tiers.tailbite.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.tailbite.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.tailbite.steps]]
name = "tail-biting-sweep"
experiment = "tail-biting-sweep"
seed = 42 # query seed, held fixed; the rotation draws are 42, 7, 13, 29, 101
datasets = [
  "data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs",
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
  "data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs",
]
argv = ["python3", "scripts/tail_biting_sweep.py"]

