schema_version = 1

[artifact]
name = "ultravec-ann"
default_seed = 42
results_dir = "results/generated"

[tiers.check]
description = "Portable locked build and correctness tests"
required_files = ["Cargo.lock"]

[[tiers.check.steps]]
name = "format"
argv = ["cargo", "fmt", "--all", "--", "--check"]

[[tiers.check.steps]]
name = "unit-tests"
argv = ["cargo", "test", "--locked", "--all-targets"]

[[tiers.check.steps]]
name = "runner-tests"
argv = ["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_*.py", "-v"]

[tiers.smoke]
description = "Deterministic synthetic run through the principal codec harness"
required_files = ["Cargo.lock"]

[[tiers.smoke.steps]]
name = "synthetic-input"
argv = ["python3", "scripts/generate_smoke_data.py"]

[[tiers.smoke.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.smoke.steps]]
name = "synthetic-low-bit"
experiment = "smoke-synthetic"
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/smoke/base.fvecs", "--query-file", "data/smoke/query.fvecs", "--query-max", "16", "--max", "128", "--bits", "2", "--seed", "42", "--sota3", "--per-query-out", "results/generated/smoke-synthetic/per-query.csv"]

[tiers.core]
description = "Core recall and cold-start evidence on SIFT and GloVe"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
  "data/source/glove-25-angular.hdf5",
]

[[tiers.core.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.core.steps]]
name = "prepare-glove"
argv = ["python3", "scripts/prepare_glove.py"]

[[tiers.core.steps]]
name = "sift-recall"
experiment = "common-reconstruction-sift"
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3", "--per-query-out", "results/generated/common-reconstruction-sift/per-query.csv"]

[[tiers.core.steps]]
name = "coldstart-sift-ci"
experiment = "coldstart-sift"
seed = 42 # base seed; the script evaluates the fixed sequence 42..47
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["python3", "scripts/coldstart_seed_ci.py"]

[[tiers.core.steps]]
name = "coldstart-glove-ci"
experiment = "coldstart-glove"
seed = 42 # base seed; the script evaluates the fixed sequence 42..47
datasets = ["data/glove/glove_base.fvecs", "data/glove/glove_query.fvecs"]
argv = ["python3", "scripts/coldstart_glove_seed_ci.py"]

[tiers.systems]
description = "SIFT1M IVF and HNSW recall-throughput evidence"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

# The IVF comparison codes every codec's residual to its coarse centroid -- the step
# RaBitQ's own construction is published with. It is declared here rather than left to
# the launching shell, because a shell-set knob reproduces as its own absence.
[tiers.systems.env]
ULTRAVEC_IVF_CENTER = "1"

[[tiers.systems.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.systems.steps]]
name = "ivf-pareto"
experiment = "systems-ivf-sift1m"
argv = ["cargo", "run", "--locked", "--release", "--", "ivf", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--max", "1000000", "--query-max", "200", "--bits", "2", "--nlist", "1024", "--nprobe", "1,2,4,8,16,32,64,128", "--shortlist", "128,256,512", "--reps", "3", "--seed", "42"]

[[tiers.systems.steps]]
name = "hnsw-pareto"
experiment = "systems-hnsw-sift1m"
argv = ["cargo", "run", "--locked", "--release", "--", "hnsw", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--max", "1000000", "--query-max", "200", "--bits", "2", "--m", "16", "--ef-construction", "200", "--ef", "16,32,64,128,256", "--codecs", "fp32,trellis,trellis_codes_only,rabitq,baseline", "--reps", "3", "--seed", "42"]

# The stage-1 scorer is a reported design choice, so it carries evidence rather than a
# default nobody measured. Centering is declared because the residual-norm lever only
# exists under it -- and because the reported arm is centered.
[tiers.shortlist]
description = "Shortlist stage-1 scorer: asymmetric vs symmetric, and the residual-norm weight"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

[tiers.shortlist.env]
ULTRAVEC_IVF_CENTER = "1"

[[tiers.shortlist.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.shortlist.steps]]
name = "shortlist-scorer-ab"
experiment = "shortlist-scorer-ab"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["python3", "scripts/shortlist_scorer_ab.py"]

# The control variate is an estimator change, not a reconstruction change, so it is
# measured by search recall rather than by `recon` -- the correction lives in `score`
# and a reconstruction-based driver would be blind to it.
[tiers.resid]
description = "Residual control variate on the trellis base, bit-matched against a finer base"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

[[tiers.resid.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.resid.steps]]
name = "residual-control-variate"
experiment = "residual-control-variate"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["python3", "scripts/residual_control_variate.py"]

# The one-bit operating point. `tab:ratemem` measures M=14 worth +1.14 points at one
# bit for an unchanged 22-byte record, but under exact-cosine gold on normalized
# SIFT-128 -- a different protocol from the flat comparison. This tier asks the same
# question under the flat table's own protocol, on all three corpora, which is the only
# footing on which a reported cell may move. The memory is DECLARED rather than
# inherited so the bundle records which operating point produced it.
[tiers.lowrate]
description = "One-bit cells at M=14 under the flat protocol (raw-IP gold, three corpora)"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/gist/gist_base.fvecs",
  "data/dbpedia/dbpedia_base.fvecs",
]

[tiers.lowrate.env]
ULTRAVEC_TRELLIS_MEM = "14"

[[tiers.lowrate.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.lowrate.steps]]
name = "sift-recall-m14"
experiment = "lowrate-sift-m14"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1", "--metric", "ip", "--seed", "42", "--sota3"]

[[tiers.lowrate.steps]]
name = "gist-recall-m14"
experiment = "lowrate-gist-m14"
seed = 42
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/gist/gist_base.fvecs", "--query-file", "data/gist/gist_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1", "--metric", "ip", "--seed", "42", "--sota3"]

[[tiers.lowrate.steps]]
name = "dbpedia-recall-m14"
experiment = "lowrate-dbpedia-m14"
seed = 42
datasets = ["data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/dbpedia/dbpedia_base.fvecs", "--query-file", "data/dbpedia/dbpedia_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1", "--metric", "ip", "--seed", "42", "--sota3"]

# Its own tier rather than a fourth step of `lowrate`: the GIST one-bit cell is the
# only one whose verdict depends on the rotation draw, and re-running the three flat
# benches to get at it would cost half an hour for nothing.
[tiers.lowrate-rotation]
description = "Rotation-draw verdict for the GIST one-bit cell at M=14"
required_files = [
  "Cargo.lock",
  "data/gist/gist_base.fvecs",
  "data/gist/gist_query.fvecs",
]

[tiers.lowrate-rotation.env]
ULTRAVEC_TRELLIS_MEM = "14"

[[tiers.lowrate-rotation.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.lowrate-rotation.steps]]
name = "rotation-seed-ci-m14"
experiment = "lowrate-rotation-m14"
seed = 42
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["python3", "scripts/rotation_seed_ci.py", "--corpora", "GIST", "--rates", "1"]

# Separate from the GIST tier so neither has to be re-run to get at the other: each is
# five full draws of a 100k bench at M=14 and costs over an hour. DBpedia's one-bit cell
# is not in doubt -- it led every draw at M=12 -- but the reported cell moves to M=14, so
# the rotation evidence behind it has to move too or the table mixes operating points.
[tiers.lowrate-rotation-dbpedia]
description = "Rotation-draw verdict for the DBpedia one-bit cell at M=14"
required_files = [
  "Cargo.lock",
  "data/dbpedia/dbpedia_base.fvecs",
  "data/dbpedia/dbpedia_query.fvecs",
]

[tiers.lowrate-rotation-dbpedia.env]
ULTRAVEC_TRELLIS_MEM = "14"

[[tiers.lowrate-rotation-dbpedia.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.lowrate-rotation-dbpedia.steps]]
name = "rotation-seed-ci-m14-dbpedia"
experiment = "lowrate-rotation-m14-dbpedia"
seed = 42
datasets = ["data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs"]
argv = ["python3", "scripts/rotation_seed_ci.py", "--corpora", "DBpedia", "--rates", "1"]

# Centering granularity. The driver injects ULTRAVEC_IVF_NLIST / ULTRAVEC_CENTER per
# subprocess (the appendix_ablations pattern), so nothing is inherited from the shell
# and the tier stays declarative.
[tiers.centering-granularity]
description = "How fine centering should be, and what each granularity costs in bytes"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

[[tiers.centering-granularity.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.centering-granularity.steps]]
name = "centering-granularity"
experiment = "centering-granularity"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["python3", "scripts/centering_granularity.py"]

# Fifteen rotation draws on the GIST cells whose verdict is decided by the draw. The
# published five leave a t-interval wider than the margin it brackets; fifteen is 2.24x
# tighter and is the only axis that can settle those cells, since GIST's query file
# holds exactly 1,000 records and cannot be extended.
[tiers.rotation-draws]
description = "Optional deep dive: fifteen rotation draws per tabulated cell at M=16"
# Not the source of any reported number -- the paper reports the five-draw study in
# `rotation16`, and this tier is kept because the flag is useful, not because it ran.
# It costs roughly 170 h: about 6.4 h per GIST draw at M=16 across four rates, and
# again for DBpedia. Restrict it with --corpora/--rates before reaching for it.
required_files = [
  "Cargo.lock",
  "data/gist/gist_base.fvecs",
  "data/dbpedia/dbpedia_base.fvecs",
]

[tiers.rotation-draws.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.rotation-draws.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.rotation-draws.steps]]
name = "rotation-draws-gist"
experiment = "rotation-draws-gist"
seed = 42
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["python3", "scripts/rotation_seed_ci.py", "--draws", "15"]

# The flat comparison at the operating point every codec is now best at: UltraVec at
# M=16 (byte-identical to M=12 -- the start state is two bytes for every M from 9 to 16
# -- and worth a point at two bits), PVQ at the block its record already pays for, and
# BlockQuant at the width its codebook budget already admits.
[tiers.flat16]
description = "Flat MIPS comparison with every codec at its best setting for its bytes"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/gist/gist_base.fvecs",
  "data/dbpedia/dbpedia_base.fvecs",
]

[tiers.flat16.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.flat16.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.flat16.steps]]
name = "sift-recall-m16"
experiment = "flat16-sift"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

[[tiers.flat16.steps]]
name = "gist-recall-m16"
experiment = "flat16-gist"
seed = 42
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/gist/gist_base.fvecs", "--query-file", "data/gist/gist_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

[[tiers.flat16.steps]]
name = "dbpedia-recall-m16"
experiment = "flat16-dbpedia"
seed = 42
datasets = ["data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/dbpedia/dbpedia_base.fvecs", "--query-file", "data/dbpedia/dbpedia_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

# The flat comparison at one million, on the one corpus whose full base is staged and
# whose codes fit in RAM at every rate. The 100k tables stay: every other corpus is at
# 100k and the cross-corpus comparison has to stay matched, so this is an additional
# scale point rather than a replacement. Feasible only since the ground truth became
# parallel -- at 1M the old serial gold was the whole cost of the run.
[tiers.flat1m]
description = "Flat MIPS comparison on SIFT at one million base vectors, M=16"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

[tiers.flat1m.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.flat1m.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.flat1m.steps]]
name = "sift1m-recall-m16"
experiment = "flat1m-sift"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--query-max", "1000", "--max", "1000000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

# SIFT1M IVF and HNSW at the operating point the codec is actually best at. The systems
# tables ran at M=12 only because encoding at 16 was unaffordable before the encoder
# scratch fix; the record is byte-identical, so this is recall at unchanged storage.
[tiers.systems16]
description = "SIFT1M IVF and HNSW evidence at M=16"
required_files = [
  "Cargo.lock",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
]

[tiers.systems16.env]
ULTRAVEC_TRELLIS_MEM = "16"
ULTRAVEC_IVF_CENTER = "1"

[[tiers.systems16.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.systems16.steps]]
name = "ivf-pareto-m16"
experiment = "systems16-ivf-sift1m"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "ivf", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--max", "1000000", "--query-max", "200", "--bits", "2", "--nlist", "1024", "--nprobe", "1,2,4,8,16,32,64,128", "--shortlist", "128,256,512", "--reps", "3", "--seed", "42"]

[[tiers.systems16.steps]]
name = "hnsw-pareto-m16"
experiment = "systems16-hnsw-sift1m"
seed = 42
datasets = ["data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "hnsw", "--dataset", "data/sift/sift_base.fvecs", "--query-file", "data/sift/sift_query.fvecs", "--max", "1000000", "--query-max", "200", "--bits", "2", "--m", "16", "--ef-construction", "200", "--ef", "16,32,64,128,256", "--codecs", "fp32,trellis,trellis_codes_only,rabitq,baseline", "--reps", "3", "--seed", "42"]

# GIST and DBpedia at M=16, completing the flat comparison so all three corpora share
# one operating point. Split from `flat16` only so the finished SIFT step is not re-run;
# the argv are identical to that tier's.
[tiers.flat16-rest]
description = "Flat MIPS comparison at M=16, GIST and DBpedia"
required_files = [
  "Cargo.lock",
  "data/gist/gist_base.fvecs",
  "data/dbpedia/dbpedia_base.fvecs",
]

[tiers.flat16-rest.env]
ULTRAVEC_TRELLIS_MEM = "16"

[[tiers.flat16-rest.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.flat16-rest.steps]]
name = "gist-recall-m16"
experiment = "flat16-gist"
seed = 42
datasets = ["data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/gist/gist_base.fvecs", "--query-file", "data/gist/gist_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

[[tiers.flat16-rest.steps]]
name = "dbpedia-recall-m16"
experiment = "flat16-dbpedia"
seed = 42
datasets = ["data/dbpedia/dbpedia_base.fvecs", "data/dbpedia/dbpedia_query.fvecs"]
argv = ["cargo", "run", "--locked", "--release", "--", "bench", "--dataset", "data/dbpedia/dbpedia_base.fvecs", "--query-file", "data/dbpedia/dbpedia_query.fvecs", "--query-max", "1000", "--max", "100000", "--bits", "1,2,3,4", "--metric", "ip", "--seed", "42", "--sota3"]

[tiers.mechanism]
description = "Fidelity/MSE identifiability diagnostic and estimator-axis control"
required_files = [
  "Cargo.lock",
  "data/siftsmall/siftsmall_base.fvecs",
  "data/siftsmall/siftsmall_query.fvecs",
  "data/sift/sift_base.fvecs",
  "data/sift/sift_query.fvecs",
  "data/source/glove-25-angular.hdf5",
  "data/gist/gist_base.fvecs",
  "data/gist/gist_query.fvecs",
]

[[tiers.mechanism.steps]]
# The mechanism drivers invoke the release binary directly.
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.mechanism.steps]]
name = "prepare-glove"
argv = ["python3", "scripts/prepare_glove.py"]

[[tiers.mechanism.steps]]
name = "mechanism-inputs"
experiment = "mechanism-inputs"
seed = 42
datasets = [
  "data/siftsmall/siftsmall_base.fvecs", "data/siftsmall/siftsmall_query.fvecs",
  "data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs",
  "data/glove/glove_base.fvecs", "data/glove/glove_query.fvecs",
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
]
argv = ["python3", "scripts/generate_mechanism_inputs.py"]

[[tiers.mechanism.steps]]
name = "mechanism-statistics"
experiment = "mechanism-statistics"
seed = 42
depends_on = ["mechanism-inputs"]
datasets = [
  "data/siftsmall/siftsmall_base.fvecs", "data/siftsmall/siftsmall_query.fvecs",
  "data/sift/sift_base.fvecs", "data/sift/sift_query.fvecs",
  "data/glove/glove_base.fvecs", "data/glove/glove_query.fvecs",
  "data/gist/gist_base.fvecs", "data/gist/gist_query.fvecs",
]
argv = ["python3", "scripts/mechanism_pvalues.py"]

# Focused tiers expose individual studies without requiring the complete campaign.
[tiers.shift]
description = "Controlled SIFT covariate shift: transferred PQ against the fixed codec"
required_files = ["Cargo.lock", "data/sift/sift_base.fvecs"]

[[tiers.shift.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.shift.steps]]
name = "sift-distribution-shift"
experiment = "shift-sift"
seed = 42
datasets = ["data/sift/sift_base.fvecs"]
argv = ["python3", "scripts/ann_distshift.py"]

[tiers.erab]
description = "Official E-RaBitQ bootstrap against the fitted PCA-head residual hybrid"
required_files = ["Cargo.lock", "data/erab/base.fvecs", "data/erab/query.fvecs"]

[[tiers.erab.steps]]
name = "release-build"
argv = ["cargo", "build", "--locked", "--release"]

[[tiers.erab.steps]]
name = "official-erabitq-bootstrap"
experiment = "official-erabitq-bootstrap"
seed = 42
# Verbatim from `full`: validate_claims rejects an experiment two tiers define
# differently, which is what makes a focused tier trustworthy.
datasets = [
  "data/erab/base.fvecs",
  "data/erab/query.fvecs",
  "data/erab/gold.ivecs",
  "data/erab/ivfA/erabIVF_n1_b1.ivecs",
